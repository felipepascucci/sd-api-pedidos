server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com proxy_pass usando variável, o nginx resolve o
    # nome a cada requisição: sobe mesmo com pedidos/inspector fora do ar e
    # continua funcionando depois que eles reiniciam.
    resolver 127.0.0.11 valid=10s ipv6=off;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_redirect off;          # não reescrever o header Location da API
    proxy_read_timeout 90s;      # restart de container pode demorar
    proxy_connect_timeout 5s;

    location /api/ {
        set $pedidos_upstream pedidos:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$pedidos_upstream;
    }

    location /inspector/ {
        set $inspector_upstream inspector:8001;
        rewrite ^/inspector/(.*)$ /$1 break;
        proxy_pass http://$inspector_upstream;
    }

    # Assets com hash no nome podem ficar em cache.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA: qualquer outra rota cai no index.html (react-router).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
